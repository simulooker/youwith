<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3d7a5d">
    <title>로그인 · YouWith</title>
    <link rel="stylesheet" href="/login.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="login-panel">
      <a class="brand" href="/login.html" aria-label="YouWith 로그인">YouWith<img src="/assets/clover.png" alt="" width="34" height="34"></a>
      <h1>함께하는 오늘,<br>로그인하고 시작해요.</h1>
      <a class="kakao-login" href="/auth/kakao" id="kakao-login"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.45 2 10.7c0 2.73 1.86 5.12 4.66 6.49l-1.18 4.3c-.1.36.3.65.61.44l5.04-3.37c.29.02.58.03.87.03 5.52 0 10-3.45 10-7.7S17.52 3 12 3Z"/></svg>카카오 로그인</a>
      <p id="kakao-status" class="account-help" role="status"></p>
      <p class="account-help">처음 로그인하면 가입 신청이 접수돼요.<br>운영진 승인 후 이용할 수 있어요.</p>
      <details class="password-login"><summary>기존 아이디로 로그인</summary>
      <form id="login-form">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" required maxlength="40" autocapitalize="none" spellcheck="false">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <p id="login-error" role="alert"></p>
        <button type="submit">로그인</button>
      </form>
      </details>
      <p class="account-help">가입 승인 문의는 동아리 운영진에게 해주세요.</p>
    </main>
  </body>
</html>
